groups:
  - id: theory
    label: 理论与方法
    description: 强化学习基础、概率、策略优化与动作建模。
    label_en: Theory & Methods
    description_en: RL foundations, probability, policy optimization, and action modeling.
  - id: evaluation
    label: 基准与实验方法
    description: Benchmark 选型、统计评价与可复现实验协议。
    label_en: Benchmarks & Evaluation
    description_en: Benchmark selection, statistical evaluation, and reproducible protocols.
  - id: research
    label: 学术研究
    description: 研究问题、方法分析与学术讨论。
    label_en: Research
    description_en: Research questions, method analysis, and academic discussions.
  - id: engineering
    label: 工程实践
    description: 工具链、系统实现、部署与问题排查。
    label_en: Engineering
    description_en: Toolchains, implementation, deployment, and troubleshooting.
  - id: reproduction
    label: 实验复现
    description: 算法实现、实验配置、结果与可复现性。
    label_en: Reproduction
    description_en: Algorithm implementation, experiments, results, and reproducibility.
  - id: reading
    label: 文献阅读
    description: 论文的问题、方法、实验与阅读思考。
    label_en: Literature Reading
    description_en: Research problems, methods, experiments, and reading reflections.
